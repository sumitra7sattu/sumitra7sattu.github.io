<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरी पहली वेबसाइट</title>
    <style>
        /* वेबसाइट का डिज़ाइन */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #7f8c8d;
            line-height: 1.6;
        }
        .success-badge {
            background-color: #2ecc71;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 20px;
        }
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-badge">बधाई हो! 🎉</div>
        <h1>मेरी वेबसाइट लाइव हो गई है!</h1>
        <p>यह मेरी पहली वेबसाइट है जिसे मैंने <strong>GitHub Pages</strong> की मदद से मुफ़्त में होस्ट किया है।</p>
        
        <footer>
            बनाया गया: Satendra Kumar
        </footer>
    </div>

</body>
</html>
